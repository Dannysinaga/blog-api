services:
  db:
    image: postgres:15 # Catatan: Postgres 18 belum rilis stabil di 2024, disarankan gunakan 15 atau 16
    container_name: postgres_container
    restart: always
    environment:
      - POSTGRES_PASSWORD=admin
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data 
    ports:
      - "6543:5432"

  cache: # Sekarang sejajar dengan db
    image: redis:latest
    container_name: redis_container
    restart: always
    ports: # Sebelumnya typo 'points'
      - "6379:6379"